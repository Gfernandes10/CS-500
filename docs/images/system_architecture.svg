<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tello project system architecture</title>
  <desc id="desc">Architecture diagram showing the DJI Tello drone, UDP command telemetry and video channels, the tello_core library, CLI tools, Qt Control Panel, ROS2 bridge, and metrics outputs.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .core { fill: #eef6ff; stroke: #1d4ed8; stroke-width: 2.5; rx: 16; }
      .module { fill: #ffffff; stroke: #60a5fa; stroke-width: 1.6; rx: 10; }
      .app { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 14; }
      .ros { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .metrics { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 14; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 18px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #334155; font-size: 14px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #475569; font-size: 12px; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 24px; font-weight: 700; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; fill: #334155; font-size: 16px; font-weight: 700; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-green { stroke: #15803d; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-orange { stroke: #c2410c; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead-orange); }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#334155"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#15803d"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <text class="title" x="600" y="42" text-anchor="middle">DJI Tello C++ Stack Architecture</text>

  <rect class="panel" x="50" y="105" width="220" height="250"/>
  <text class="subtitle" x="160" y="142" text-anchor="middle">DJI Tello Drone</text>
  <text class="small" x="160" y="176" text-anchor="middle">Wi-Fi SDK endpoint</text>
  <text class="tiny" x="160" y="204" text-anchor="middle">192.168.10.1</text>
  <line x1="90" y1="229" x2="230" y2="229" stroke="#cbd5e1" stroke-width="1"/>
  <text class="small" x="160" y="260" text-anchor="middle">Command: UDP 8889</text>
  <text class="small" x="160" y="288" text-anchor="middle">Telemetry: UDP 8890</text>
  <text class="small" x="160" y="316" text-anchor="middle">Video: UDP 11111</text>

  <rect class="core" x="410" y="80" width="360" height="410"/>
  <text class="subtitle" x="590" y="116" text-anchor="middle">tello_core</text>
  <text class="small" x="590" y="142" text-anchor="middle">Reusable C++ runtime library</text>

  <rect class="module" x="438" y="170" width="138" height="70"/>
  <text class="small" x="507" y="198" text-anchor="middle">UdpSocket</text>
  <text class="tiny" x="507" y="220" text-anchor="middle">UDP transport</text>

  <rect class="module" x="604" y="170" width="138" height="70"/>
  <text class="small" x="673" y="198" text-anchor="middle">CommandExecutor</text>
  <text class="tiny" x="673" y="220" text-anchor="middle">timeout + retry</text>

  <rect class="module" x="438" y="265" width="138" height="70"/>
  <text class="small" x="507" y="293" text-anchor="middle">StateReceiver</text>
  <text class="tiny" x="507" y="315" text-anchor="middle">telemetry cache</text>

  <rect class="module" x="604" y="265" width="138" height="70"/>
  <text class="small" x="673" y="293" text-anchor="middle">TelloClient</text>
  <text class="tiny" x="673" y="315" text-anchor="middle">SDK facade</text>

  <rect class="module" x="438" y="360" width="138" height="70"/>
  <text class="small" x="507" y="388" text-anchor="middle">FFmpeg Reader</text>
  <text class="tiny" x="507" y="410" text-anchor="middle">H264 decode</text>

  <rect class="module" x="604" y="360" width="138" height="70"/>
  <text class="small" x="673" y="388" text-anchor="middle">MetricsCollector</text>
  <text class="tiny" x="673" y="410" text-anchor="middle">runtime metrics</text>

  <path class="arrow-blue" d="M 270 260 C 322 230, 350 205, 438 205"/>
  <text class="tiny" x="337" y="217" text-anchor="middle">commands / responses</text>
  <path class="arrow-blue" d="M 270 288 C 325 286, 365 300, 438 300"/>
  <text class="tiny" x="354" y="279" text-anchor="middle">state packets</text>
  <path class="arrow-blue" d="M 270 316 C 330 365, 365 395, 438 395"/>
  <text class="tiny" x="338" y="363" text-anchor="middle">H264 stream</text>

  <rect class="app" x="900" y="90" width="230" height="95"/>
  <text class="subtitle" x="1015" y="125" text-anchor="middle">CLI Tools</text>
  <text class="small" x="1015" y="153" text-anchor="middle">smoke, command watch,</text>
  <text class="small" x="1015" y="174" text-anchor="middle">state watch, video watch</text>

  <rect class="app" x="900" y="235" width="230" height="120"/>
  <text class="subtitle" x="1015" y="270" text-anchor="middle">Qt Control Panel</text>
  <text class="small" x="1015" y="300" text-anchor="middle">video, telemetry, CSV,</text>
  <text class="small" x="1015" y="322" text-anchor="middle">keyboard RC, diagnostics</text>

  <rect class="ros" x="900" y="410" width="230" height="120"/>
  <text class="subtitle" x="1015" y="445" text-anchor="middle">ROS2 Bridge</text>
  <text class="small" x="1015" y="475" text-anchor="middle">topics, services, cmd_vel,</text>
  <text class="small" x="1015" y="497" text-anchor="middle">image_raw, link_quality</text>

  <path class="arrow-green" d="M 770 205 C 818 180, 844 150, 900 138"/>
  <path class="arrow-green" d="M 770 300 C 820 295, 850 295, 900 295"/>
  <path class="arrow-orange" d="M 770 395 C 820 430, 850 455, 900 470"/>

  <text class="tiny" x="835" y="174" text-anchor="middle">core API</text>
  <text class="tiny" x="835" y="285" text-anchor="middle">core API</text>
  <text class="tiny" x="835" y="438" text-anchor="middle">core API</text>

  <rect class="metrics" x="340" y="565" width="520" height="95"/>
  <text class="subtitle" x="600" y="600" text-anchor="middle">Experiment Outputs</text>
  <text class="small" x="600" y="630" text-anchor="middle">CSV metrics, state recordings, logs, plots, report figures</text>

  <path class="arrow" d="M 673 430 C 675 500, 640 535, 610 565"/>
  <text class="tiny" x="705" y="515" text-anchor="middle">metrics snapshots</text>

  <path class="arrow dash" d="M 1015 530 C 1015 610, 860 640, 860 640"/>
  <text class="tiny" x="998" y="595" text-anchor="middle">ROS diagnostics</text>

  <rect x="64" y="520" width="190" height="105" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" rx="12"/>
  <text class="subtitle" x="159" y="552" text-anchor="middle">Design Boundary</text>
  <text class="tiny" x="159" y="580" text-anchor="middle">Drone-specific logic lives</text>
  <text class="tiny" x="159" y="600" text-anchor="middle">inside tello_core.</text>
  <text class="tiny" x="159" y="620" text-anchor="middle">Apps and ROS reuse it.</text>
</svg>
