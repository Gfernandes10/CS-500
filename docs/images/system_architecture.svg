<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">System architecture</title>
  <desc id="desc">The standalone and ROS2 paths reuse the same Qt user-interface library and converge on the same ROS-independent tello_core component. From tello_core onward, both deployments use the same UDP transport to communicate with the DJI Tello.</desc>

  <defs>
    <style>
      .page { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke-width: 1.8; }
      .lane-standalone { stroke: #2563eb; }
      .lane-ros { stroke: #ea580c; }
      .shared-ui { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .app { fill: #ffffff; stroke: #64748b; stroke-width: 1.7; }
      .standalone { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .ros { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
      .driver { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.8; }
      .core { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; }
      .module { fill: #ffffff; stroke: #6ee7b7; stroke-width: 1.3; }
      .transport { fill: #f1f5f9; stroke: #475569; stroke-width: 1.7; }
      .drone { fill: #0f172a; stroke: #0f172a; stroke-width: 2; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #475569; }
      .lane-title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #334155; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #475569; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .white-heading { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .white-body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .reuse { stroke: #16a34a; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
      .flow-standalone { stroke: #2563eb; stroke-width: 2.4; fill: none; }
      .flow-ros { stroke: #ea580c; stroke-width: 2.4; fill: none; }
      .flow-core { stroke: #059669; stroke-width: 2.6; fill: none; }
      .flow-udp { stroke: #334155; stroke-width: 2.6; fill: none; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="700" y="38" text-anchor="middle">System Architecture</text>
  <text class="subtitle" x="700" y="63" text-anchor="middle">Shared user interface and communication core across standalone and ROS2 deployments</text>

  <!-- Shared UI library -->
  <rect class="shared-ui" x="450" y="82" width="500" height="88" rx="14"/>
  <text class="heading" x="700" y="111" text-anchor="middle">tello_control_panel_ui</text>
  <text class="body" x="700" y="135" text-anchor="middle">shared Qt widgets · plots · profiles · history · CSV</text>
  <text class="small" x="700" y="155" text-anchor="middle">ControlBackend contract and ROS-neutral DTOs</text>

  <!-- Deployment lanes -->
  <rect class="lane lane-standalone" x="35" y="205" width="645" height="380" rx="17"/>
  <rect x="35" y="205" width="645" height="53" rx="17" fill="#dbeafe"/>
  <rect x="35" y="241" width="645" height="17" fill="#dbeafe"/>
  <text class="lane-title" x="357" y="237" text-anchor="middle">Standalone Path</text>

  <rect class="lane lane-ros" x="720" y="205" width="645" height="380" rx="17"/>
  <rect x="720" y="205" width="645" height="53" rx="17" fill="#ffedd5"/>
  <rect x="720" y="241" width="645" height="17" fill="#ffedd5"/>
  <text class="lane-title" x="1042" y="237" text-anchor="middle">ROS2 Path</text>

  <!-- UI reuse links; control-panel positions keep them uncrossed -->
  <path class="reuse" d="M575 170 V185 H700 V332 H655"/>
  <path class="reuse" d="M875 170 V185 H730 V332 H745"/>

  <!-- Standalone components -->
  <text class="label" x="65" y="283">APPLICATIONS</text>
  <rect class="app" x="75" y="297" width="260" height="70" rx="10"/>
  <text class="heading" x="205" y="325" text-anchor="middle">tello_cli</text>
  <text class="body" x="205" y="349" text-anchor="middle">direct core access</text>

  <rect class="app" x="405" y="297" width="250" height="70" rx="10"/>
  <text class="heading" x="530" y="325" text-anchor="middle">tello_control_panel</text>
  <text class="body" x="530" y="349" text-anchor="middle">standalone Qt application</text>

  <path class="flow-standalone" d="M530 367 V411"/>
  <path d="M524 403 L536 403 L530 412 Z" fill="#2563eb"/>
  <text class="label" x="405" y="402">BACKEND</text>
  <rect class="standalone" x="405" y="416" width="250" height="72" rx="10"/>
  <text class="heading" x="530" y="444" text-anchor="middle">StandaloneBackend</text>
  <text class="body" x="530" y="468" text-anchor="middle">implements ControlBackend</text>

  <!-- ROS2 components -->
  <text class="label" x="750" y="283">APPLICATION AND BACKEND </text>
  <rect class="app" x="745" y="297" width="260" height="70" rx="10"/>
  <text class="heading" x="875" y="325" text-anchor="middle">tello_control_panel_ros</text>
  <text class="body" x="875" y="349" text-anchor="middle">ROS2 Qt application</text>

  <path class="flow-ros" d="M1005 332 H1020"/>
  <path d="M1012 326 L1012 338 L1021 332 Z" fill="#ea580c"/>
  <rect class="ros" x="1025" y="297" width="270" height="70" rx="10"/>
  <text class="heading" x="1160" y="325" text-anchor="middle">RosBackend</text>
  <text class="body" x="1160" y="349" text-anchor="middle">implements ControlBackend</text>

  <path class="flow-ros" d="M1160 367 V403"/>
  <path d="M1154 395 L1166 395 L1160 404 Z" fill="#ea580c"/>
  <rect class="ros" x="975" y="408" width="370" height="55" rx="10"/>
  <text class="heading" x="1160" y="432" text-anchor="middle">ROS2 topics and services</text>
  <text class="small" x="1160" y="452" text-anchor="middle">commands · state · video · metrics · diagnostics</text>

  <path class="flow-ros" d="M1160 463 V493"/>
  <path d="M1154 485 L1166 485 L1160 494 Z" fill="#ea580c"/>
  <rect class="driver" x="975" y="498" width="370" height="63" rx="10"/>
  <text class="heading" x="1160" y="524" text-anchor="middle">tello_driver_node</text>
  <text class="body" x="1160" y="547" text-anchor="middle">sole ROS-mode owner of tello_core</text>

  <!-- Direct convergence on the shared core -->
  <path class="flow-core" d="M205 367 V570 H390 V616"/>
  <path class="flow-core" d="M530 488 V616"/>
  <path class="flow-core" d="M1160 561 V616"/>
  <path d="M384 608 L396 608 L390 617 Z" fill="#059669"/>
  <path d="M524 608 L536 608 L530 617 Z" fill="#059669"/>
  <path d="M1154 608 L1166 608 L1160 617 Z" fill="#059669"/>

  <rect class="core" x="225" y="621" width="950" height="115" rx="14"/>
  <text class="heading" x="700" y="650" text-anchor="middle">tello_core</text>
  <text class="small" x="700" y="670" text-anchor="middle">the selected standalone application or tello_driver_node owns the runtime instance</text>
  <rect class="module" x="255" y="690" width="200" height="31" rx="7"/>
  <text class="body" x="355" y="710" text-anchor="middle">TelloClient + commands</text>
  <rect class="module" x="485" y="690" width="200" height="31" rx="7"/>
  <text class="body" x="585" y="710" text-anchor="middle">StateReceiver</text>
  <rect class="module" x="715" y="690" width="200" height="31" rx="7"/>
  <text class="body" x="815" y="710" text-anchor="middle">FFmpeg decoder</text>
  <rect class="module" x="945" y="690" width="200" height="31" rx="7"/>
  <text class="body" x="1045" y="710" text-anchor="middle">Metrics + recovery</text>

  <!-- Common communication path -->
  <path class="flow-udp" d="M700 736 V756"/>
  <rect class="transport" x="380" y="756" width="640" height="55" rx="10"/>
  <text class="heading" x="700" y="780" text-anchor="middle">Bidirectional UDP transport</text>
  <text class="small" x="700" y="801" text-anchor="middle">8889 command · 8890 telemetry · 11111 H.264 video</text>
  <path class="flow-udp" d="M700 811 V830"/>

  <rect class="drone" x="500" y="830" width="400" height="58" rx="13"/>
  <text class="white-heading" x="700" y="855" text-anchor="middle">DJI Tello</text>
  <text class="white-body" x="700" y="876" text-anchor="middle">192.168.10.1</text>
</svg>
